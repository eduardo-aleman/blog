# =============================================================================
# data/feeds.toml
# -----------------------------------------------------------------------------
# Drives the homepage "Dispatches" section, per language. The same file feeds
# both the English (/en) and Spanish (/es) homepages; the `lang` field on each
# feed decides where it appears.
#
# STRUCTURE
#   [heading]                       bilingual section heading
#   [[sections]]                    one category
#     id        = "..."             stable id (used for the anchor + CSS hook)
#     limit     = 6                 max items shown (newest first)
#     [sections.title]              bilingual category title
#       en / es
#     [[sections.feeds]]            one source
#       name = "..."                small label shown under each headline
#       url  = "..."                RSS/Atom URL
#       lang = "en" | "es"          show only on that homepage; omit = both
#
# FEED TYPES
#   native   — the publication's own RSS feed (clean, direct article links).
#   gnews    — a Google News search feed. `q=site:DOMAIN` pulls *only* that
#              outlet; add topic words to filter a general-interest site.
#              Links are news.google.com redirects. Locale: en -> hl=en-US
#              gl=US ceid=US:en ; es -> hl=es gl=ES ceid=ES:es.
#
# A dead or empty feed is skipped at build time and named in a `warnf` line in
# your `hugo serve` output — watch there to spot any URL that needs adjusting.
# =============================================================================

[heading]
  en = "Dispatches"
  es = "Despachos"

# -----------------------------------------------------------------------------
# CUBA — all major newspapers via Google News (English on /en, Spanish on /es)
# -----------------------------------------------------------------------------
[[sections]]
  id    = "cuba"
  limit = 6
  [sections.title]
    en = "Cuba"
    es = "Cuba"

  [[sections.feeds]]
    name = "Google News"
    lang = "en"
    url  = "https://news.google.com/rss/search?q=Cuba+when:7d&hl=en-US&gl=US&ceid=US:en"
  [[sections.feeds]]
    name = "Google News"
    lang = "es"
    url  = "https://news.google.com/rss/search?q=Cuba+when:7d&hl=es-419&gl=US&ceid=US:es-419"

